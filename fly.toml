app = 'pokehunt-bot-drifting-sky-3389'
primary_region = 'iad'

[build]

[env]
  PYTHON_VERSION = '3.14'

[[mounts]]
  source = 'pokehunt_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
